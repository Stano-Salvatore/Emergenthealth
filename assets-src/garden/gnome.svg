<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 84">
  <defs>
    <radialGradient id="ghat" cx="0.6" cy="0.3" r="0.95">
      <stop offset="0" stop-color="#ef8078"/><stop offset="0.55" stop-color="#d05248"/><stop offset="1" stop-color="#8e2f29"/>
    </radialGradient>
    <radialGradient id="grobe" cx="0.6" cy="0.25" r="1">
      <stop offset="0" stop-color="#7396d9"/><stop offset="0.55" stop-color="#5075bd"/><stop offset="1" stop-color="#2f4b85"/>
    </radialGradient>
    <radialGradient id="gbeard" cx="0.58" cy="0.25" r="0.95">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.6" stop-color="#f0ebdd"/><stop offset="1" stop-color="#cdc4ab"/>
    </radialGradient>
    <radialGradient id="gface" cx="0.6" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#fbd9b4"/><stop offset="0.7" stop-color="#f3c9a0"/><stop offset="1" stop-color="#d9a678"/>
    </radialGradient>
  </defs>
  <!-- hem underside: the robe is a cone with a visible elliptical bottom -->
  <ellipse cx="30" cy="73" rx="15.5" ry="5.2" fill="#24386b"/>
  <!-- robe cone -->
  <path d="M19 41 Q30 35 41 41 L45.3 68.5 Q45.8 71.5 41 73.6 Q36 75.6 30 75.6 Q24 75.6 19 73.6 Q14.2 71.5 14.7 68.5 Z" fill="url(#grobe)"/>
  <path d="M42.6 44 Q46 58 45.2 70 Q42.6 59 40.4 46 Z" fill="#8caee8" opacity="0.5"/>
  <path d="M17.4 44 Q14.6 58 15.4 70 Q17.6 59 19.6 46 Z" fill="#1f335e" opacity="0.55"/>
  <!-- boots poking out under the hem, grounded -->
  <ellipse cx="23.5" cy="79" rx="5" ry="1.7" fill="#2a1c10" opacity="0.5"/>
  <ellipse cx="35" cy="79.8" rx="5" ry="1.7" fill="#2a1c10" opacity="0.5"/>
  <ellipse cx="23.5" cy="77.6" rx="4.6" ry="2.5" fill="#4a3423"/>
  <ellipse cx="35" cy="78.4" rx="4.6" ry="2.5" fill="#4a3423"/>
  <ellipse cx="22.4" cy="76.8" rx="2.7" ry="1.2" fill="#6b4e34" opacity="0.9"/>
  <ellipse cx="33.9" cy="77.6" rx="2.7" ry="1.2" fill="#6b4e34" opacity="0.9"/>
  <!-- sleeves + mittens -->
  <path d="M17.8 46 Q11 52 13 59.5 Q17 61.5 20 57.5 Z" fill="url(#grobe)"/>
  <path d="M42.2 46 Q49 52 47 59.5 Q43 61.5 40 57.5 Z" fill="url(#grobe)"/>
  <circle cx="14.4" cy="60.4" r="3" fill="url(#gface)"/>
  <circle cx="45.6" cy="60.4" r="3" fill="url(#gface)"/>
  <!-- beard flowing down the front, shifted toward the turned face -->
  <path d="M17 39 Q14.5 55 28.5 57.5 Q42.5 55.5 41 39 Q34.5 46.5 28 46 Q22 46.5 17 39 Z" fill="url(#gbeard)"/>
  <path d="M20 46 Q23 53 28.5 54.5 Q24 54.5 21 51 Q19.6 48.8 20 46 Z" fill="#cdc4ab" opacity="0.6"/>
  <!-- face turned 3/4 to the left -->
  <circle cx="28" cy="37" r="8" fill="url(#gface)"/>
  <circle cx="24" cy="36" r="1.4" fill="#4a3423"/>
  <circle cx="31" cy="35.6" r="1.4" fill="#4a3423"/>
  <circle cx="22.4" cy="39.2" r="1.7" fill="#eda37a" opacity="0.7"/>
  <circle cx="33.4" cy="38.6" r="1.7" fill="#eda37a" opacity="0.7"/>
  <ellipse cx="25.4" cy="40" rx="2.7" ry="2.2" fill="#e8a877"/>
  <ellipse cx="24.6" cy="39.2" rx="1" ry="0.8" fill="#f4c39a"/>
  <!-- brim shadow across the forehead -->
  <path d="M20.4 33.8 Q28.4 30.4 36 33.4 Q28.6 35.8 20.4 33.8 Z" fill="#7a4a34" opacity="0.35"/>
  <!-- hat: elliptical brim seen from above, cone bending right -->
  <ellipse cx="30" cy="31.5" rx="19" ry="7" fill="#8e2f29"/>
  <ellipse cx="30.6" cy="30.2" rx="17.8" ry="6" fill="url(#ghat)"/>
  <path d="M14 29 Q17.5 12 27 6 Q40 -1.5 42 5 Q43.5 10 45.6 15 Q48 21 47.2 27.5 Q30.5 20.5 14 29 Z" fill="url(#ghat)"/>
  <path d="M16.5 27 Q18.5 15 25 8.5 Q19.5 17 18.6 27.6 Z" fill="#8e2f29" opacity="0.55"/>
  <path d="M30 8 Q40 2 43.6 5 Q39.6 4 34 8 Q30 11 27.4 16 Q28.2 11 30 8 Z" fill="#f2a39c" opacity="0.6"/>
  <circle cx="43.6" cy="4.6" r="3" fill="url(#ghat)"/>
  <circle cx="42.8" cy="3.6" r="1" fill="#f7b3ac" opacity="0.9"/>
</svg>
