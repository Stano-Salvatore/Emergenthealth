<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 28">
  <defs>
    <radialGradient id="lbshell" cx="0.62" cy="0.3" r="0.95">
      <stop offset="0" stop-color="#f2766a"/><stop offset="0.55" stop-color="#d9463c"/><stop offset="1" stop-color="#8e241c"/>
    </radialGradient>
  </defs>
  <!-- legs reaching the ground from under the dome -->
  <path d="M5.5 13 L2.4 14.4 M6 17.5 L3 19.8 M8.5 21 L6.2 23.8" fill="none" stroke="#2f2a26" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M24.5 13 L27.6 14.4 M24 17.5 L27 19.8 M21.5 21 L23.8 23.8" fill="none" stroke="#2f2a26" stroke-width="1.3" stroke-linecap="round"/>
  <!-- domed shell seen from above-behind -->
  <ellipse cx="15" cy="13.5" rx="11" ry="9.8" fill="url(#lbshell)"/>
  <!-- dark under-rim: the shell lifts off the ground -->
  <path d="M4.6 16.5 Q7 22.6 15 23.3 Q23 22.6 25.4 16.5 Q24.2 21.8 15 22.6 Q5.8 21.8 4.6 16.5 Z" fill="#5c120c" opacity="0.6"/>
  <!-- wing split, bowed to show the dome's curve -->
  <path d="M15 3.8 Q16.8 13 15 23.1" fill="none" stroke="#7d1f18" stroke-width="1.5"/>
  <!-- spots foreshortened toward the rim -->
  <circle cx="10" cy="8.5" r="1.9" fill="#2f2a26"/>
  <ellipse cx="20.5" cy="9" rx="1.8" ry="1.6" fill="#2f2a26"/>
  <ellipse cx="7.6" cy="14.5" rx="1.7" ry="1.4" fill="#2f2a26"/>
  <ellipse cx="22.4" cy="15" rx="1.6" ry="1.3" fill="#2f2a26"/>
  <ellipse cx="10.6" cy="19.8" rx="1.5" ry="1" fill="#2f2a26"/>
  <ellipse cx="19.4" cy="20.1" rx="1.5" ry="1" fill="#2f2a26"/>
  <!-- top-right specular -->
  <ellipse cx="19.5" cy="6.6" rx="3" ry="1.8" fill="#f9a89e" opacity="0.8"/>
  <circle cx="21" cy="5.8" r="0.9" fill="#fdd3cc"/>
  <!-- pronotum + head at the front (toward the viewer) -->
  <ellipse cx="15" cy="21.8" rx="5.4" ry="2.5" fill="#3f3830"/>
  <ellipse cx="16.6" cy="21" rx="1.6" ry="0.8" fill="#6b635a" opacity="0.9"/>
  <ellipse cx="15" cy="24.2" rx="4.2" ry="2.6" fill="#2f2a26"/>
  <circle cx="12.8" cy="23.8" r="0.9" fill="#f0ede6"/>
  <circle cx="17.2" cy="23.8" r="0.9" fill="#f0ede6"/>
  <!-- antennae feeling forward -->
  <path d="M12.6 26 Q10.4 27.6 8.6 27.4 M17.4 26 Q19.6 27.6 21.4 27.4" fill="none" stroke="#2f2a26" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="8.4" cy="27.3" r="1" fill="#2f2a26"/>
  <circle cx="21.6" cy="27.3" r="1" fill="#2f2a26"/>
</svg>
