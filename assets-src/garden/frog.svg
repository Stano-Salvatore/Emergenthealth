<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 42 32">
  <defs>
    <radialGradient id="fbody" cx="0.6" cy="0.25" r="0.95">
      <stop offset="0" stop-color="#95c97e"/><stop offset="0.55" stop-color="#6fae57"/><stop offset="1" stop-color="#3d6b30"/>
    </radialGradient>
    <radialGradient id="feye" cx="0.6" cy="0.28" r="0.9">
      <stop offset="0" stop-color="#8cc46e"/><stop offset="0.7" stop-color="#5c9a48"/><stop offset="1" stop-color="#3d6b30"/>
    </radialGradient>
  </defs>
  <!-- folded rear leg on the far/right side -->
  <ellipse cx="33" cy="22.5" rx="6.2" ry="5.4" fill="url(#feye)"/>
  <path d="M33 27.4 Q38.5 29.4 41 27.6 Q38 30.2 33.6 29.6 Z" fill="#4c8a3c"/>
  <ellipse cx="38.8" cy="28.6" rx="2.6" ry="1" fill="#3d6b30" opacity="0.5"/>
  <!-- squat body dome, seen a little from above -->
  <ellipse cx="19.5" cy="19" rx="14.5" ry="10" fill="url(#fbody)"/>
  <!-- visible back: top highlight + foreshortened spots -->
  <ellipse cx="24.5" cy="13" rx="8" ry="4" fill="#c4e8ad" opacity="0.55"/>
  <ellipse cx="26.5" cy="16.5" rx="2" ry="1.2" fill="#3d6b30" opacity="0.5"/>
  <ellipse cx="21" cy="12.6" rx="1.6" ry="1" fill="#3d6b30" opacity="0.5"/>
  <ellipse cx="29.5" cy="19.5" rx="1.4" ry="0.9" fill="#3d6b30" opacity="0.5"/>
  <!-- belly sliver along the grounded front edge -->
  <path d="M7 22.5 Q11.5 28.6 21 28.8 Q13 29.6 8.4 26 Q6.8 24.4 7 22.5 Z" fill="#eaf2d2"/>
  <!-- mouth along the front-left of the dome -->
  <path d="M4 17.5 Q9.5 21.6 16.5 21" fill="none" stroke="#3d6b30" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="6.6" cy="15" r="1.6" fill="#f2a2a2" opacity="0.5"/>
  <!-- eyes as bumps on top of the head, looking front-left -->
  <circle cx="17.5" cy="7" r="4.1" fill="url(#feye)"/>
  <circle cx="17.5" cy="7" r="2.2" fill="#fff"/>
  <circle cx="16.5" cy="7.4" r="1.15" fill="#2f2a26"/>
  <circle cx="8.5" cy="9.5" r="4.7" fill="url(#feye)"/>
  <circle cx="8.5" cy="9.5" r="2.5" fill="#fff"/>
  <circle cx="7.3" cy="10" r="1.3" fill="#2f2a26"/>
  <circle cx="7" cy="7.6" r="0.9" fill="#fff" opacity="0.95"/>
  <circle cx="16.2" cy="5.4" r="0.7" fill="#fff" opacity="0.95"/>
  <!-- planted front legs with toes -->
  <path d="M9.5 22 Q8.6 26.5 7 29 Q9.4 29.6 10.8 29 Q11.6 26 12 23.5 Z" fill="#4c8a3c"/>
  <ellipse cx="6" cy="29.8" rx="1.5" ry="0.9" fill="#4c8a3c"/>
  <ellipse cx="8.6" cy="30.4" rx="1.5" ry="0.9" fill="#4c8a3c"/>
  <ellipse cx="11.2" cy="30" rx="1.5" ry="0.9" fill="#4c8a3c"/>
  <ellipse cx="8.6" cy="30.6" rx="4.6" ry="0.9" fill="#2c4a22" opacity="0.4"/>
  <path d="M16.5 23.5 Q16.2 27 15.4 29.4 Q17.4 30 18.8 29.4 Q19.2 26.5 19.4 24.4 Z" fill="#4c8a3c"/>
  <ellipse cx="15" cy="30.2" rx="1.4" ry="0.8" fill="#4c8a3c"/>
  <ellipse cx="17.4" cy="30.6" rx="1.4" ry="0.8" fill="#4c8a3c"/>
  <ellipse cx="19.6" cy="30.2" rx="1.4" ry="0.8" fill="#4c8a3c"/>
</svg>
