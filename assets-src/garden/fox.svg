<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 50">
  <defs>
    <radialGradient id="xfur" cx="0.6" cy="0.25" r="0.95">
      <stop offset="0" stop-color="#f7a862"/><stop offset="0.55" stop-color="#e8863a"/><stop offset="1" stop-color="#b45c22"/>
    </radialGradient>
    <radialGradient id="xtail" cx="0.55" cy="0.3" r="0.95">
      <stop offset="0" stop-color="#f2984e"/><stop offset="0.6" stop-color="#d9742f"/><stop offset="1" stop-color="#a34f1c"/>
    </radialGradient>
  </defs>
  <!-- tail curled on the ground around the right/front -->
  <path d="M38 26 Q52 30 49 40 Q47 47 35 47 Q28 47 26.5 44 Q33 45 38 42 Q44 38 41 30 Z" fill="url(#xtail)"/>
  <path d="M26.5 44 Q28.2 46.6 33 46.9 Q31 43.6 29.6 42.4 Q27.4 42.8 26.5 44 Z" fill="#f4dfc0"/>
  <path d="M40 30 Q44.5 36 41.5 42 Q46 37.5 43.5 31.5 Z" fill="#f2984e" opacity="0.5"/>
  <!-- far ear (behind skull) -->
  <path d="M9.5 8 L6 1.2 L14.5 5.6 Z" fill="url(#xfur)"/>
  <path d="M10.4 7 L8.2 3.2 L13 5.8 Z" fill="#5a3a20"/>
  <!-- haunch: big volume at the back -->
  <ellipse cx="32" cy="34" rx="12.5" ry="10.5" fill="url(#xfur)"/>
  <ellipse cx="35" cy="27.5" rx="6.5" ry="3.4" fill="#f7a862" opacity="0.55"/>
  <path d="M23 40 Q26 44.5 32 44.5 Q26 45.6 22.4 42.6 Z" fill="#8a4a1c" opacity="0.5"/>
  <!-- hind paw peeking out front of the haunch -->
  <ellipse cx="38.5" cy="45.6" rx="4.4" ry="1.5" fill="#5c3212" opacity="0.45"/>
  <ellipse cx="38.5" cy="44.6" rx="4" ry="2.1" fill="#f4e2c8"/>
  <!-- torso leaning forward toward the head -->
  <path d="M14 20 Q10 32 12 42 Q13 46 19 46 L26 46 Q30 44 29 36 Q28 26 24 20 Z" fill="url(#xfur)"/>
  <path d="M16.5 26.5 Q14.8 30.5 15.4 34.5 Q17.4 36.6 19.8 36.6 Q22.4 36.6 23.6 34 Q24 29.8 21 26.5 Q18.8 25.2 16.5 26.5 Z" fill="#f9ecd9"/>
  <ellipse cx="19.6" cy="30.6" rx="2.4" ry="3" fill="#fef8ee" opacity="0.8"/>
  <!-- front legs with grounded paws -->
  <ellipse cx="15.5" cy="46.4" rx="3.8" ry="1.4" fill="#5c3212" opacity="0.5"/>
  <ellipse cx="23" cy="46.4" rx="3.8" ry="1.4" fill="#5c3212" opacity="0.5"/>
  <path d="M13.5 34 L18 34 L18.4 44 Q18.4 46 15.8 46 Q13.4 46 13.4 44 Z" fill="url(#xfur)"/>
  <path d="M21 34 L25.4 34 L25.8 44 Q25.8 46 23.2 46 Q20.8 46 20.8 44 Z" fill="url(#xfur)"/>
  <ellipse cx="15.9" cy="45.2" rx="2.8" ry="1.6" fill="#8a4a1c"/>
  <ellipse cx="23.3" cy="45.2" rx="2.8" ry="1.6" fill="#8a4a1c"/>
  <!-- occlusion where the head sits on the chest -->
  <ellipse cx="17" cy="21" rx="7.5" ry="2.2" fill="#7a3d12" opacity="0.3"/>
  <!-- head turned 3/4 toward the front-left -->
  <ellipse cx="17" cy="12.5" rx="9.5" ry="8" fill="url(#xfur)"/>
  <!-- muzzle wedge pointing down-left -->
  <path d="M9 13.5 Q3.6 16.6 3.4 19 Q6.8 21.2 11 19.4 Q12.6 16.4 9 13.5 Z" fill="#f9ecd9"/>
  <ellipse cx="4.8" cy="18.4" rx="1.8" ry="1.4" fill="#3a2a20"/>
  <ellipse cx="4.3" cy="17.9" rx="0.6" ry="0.45" fill="#6b584a"/>
  <!-- eyes: far one smaller (perspective) -->
  <ellipse cx="11.6" cy="13.2" rx="1.25" ry="1.7" fill="#3a2a20"/>
  <ellipse cx="19.2" cy="12.8" rx="1.6" ry="2" fill="#3a2a20"/>
  <circle cx="11.9" cy="12.6" r="0.45" fill="#fff" opacity="0.85"/>
  <circle cx="19.7" cy="12.1" r="0.55" fill="#fff" opacity="0.9"/>
  <!-- near ear -->
  <path d="M21.5 7.5 L26.5 0.6 L28.6 8.6 Z" fill="url(#xfur)"/>
  <path d="M23.4 6.8 L26.2 3 L27.4 7.4 Z" fill="#5a3a20"/>
  <!-- top-of-head light -->
  <ellipse cx="20" cy="7.6" rx="5" ry="2.5" fill="#fbc98e" opacity="0.6"/>
</svg>
