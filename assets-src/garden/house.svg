<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 80">
  <defs>
    <linearGradient id="wallR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6e9cc"/><stop offset="1" stop-color="#e8d5ac"/>
    </linearGradient>
    <linearGradient id="roofL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a34c30"/><stop offset="1" stop-color="#8a3c26"/>
    </linearGradient>
    <linearGradient id="roofR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e08a64"/><stop offset="1" stop-color="#c2603c"/>
    </linearGradient>
  </defs>
  <!-- walls: left (shaded) + right (lit), iso construction -->
  <path d="M10 54 L42 70 L42 44 L10 28 Z" fill="#d9c49e"/>
  <path d="M42 70 L74 54 L74 28 L42 44 Z" fill="url(#wallR)"/>
  <!-- door on right wall (skewed with the wall plane) -->
  <path d="M50 64 L60 59 L60 41.5 Q60 39 57.5 40.2 L52.5 42.7 Q50 44 50 46.5 Z" fill="#8a5c33"/>
  <path d="M51.4 62.6 L54.6 61 L54.6 43.4 L51.4 45 Z" fill="#a9743f" opacity="0.55"/>
  <circle cx="58" cy="51" r="1.2" fill="#f4c15d"/>
  <!-- window on left wall -->
  <ellipse cx="24" cy="43" rx="6" ry="5.4" fill="#ffe9b0" transform="rotate(-14 24 43)"/>
  <ellipse cx="24" cy="43" rx="6" ry="5.4" fill="none" stroke="#b09a6e" stroke-width="1.8" transform="rotate(-14 24 43)"/>
  <path d="M19 40 L29 46 M26 37.6 L22 48.4" stroke="#b09a6e" stroke-width="1.2"/>
  <!-- glow spill from window -->
  <ellipse cx="24" cy="43" rx="8.5" ry="7.5" fill="#ffd97a" opacity="0.18" transform="rotate(-14 24 43)"/>
  <!-- roof planes to a single apex -->
  <path d="M6 28 L42 47 L42 4 Z" fill="url(#roofL)"/>
  <path d="M42 47 L78 28 L42 4 Z" fill="url(#roofR)"/>
  <path d="M42 47 L42 4" stroke="#f2a882" stroke-width="1.6" opacity="0.8"/>
  <path d="M6 28 L42 47 L78 28" fill="none" stroke="#6b2c1c" stroke-width="1.6" opacity="0.5"/>
  <!-- chimney as a tiny iso box on the right plane -->
  <path d="M56 14 L62 11 L62 20 L56 23 Z" fill="#b0785e"/>
  <path d="M50 11 L56 14 L56 23 L50 20 Z" fill="#96604a"/>
  <path d="M50 11 L56 8 L62 11 L56 14 Z" fill="#c98a6e"/>
  <ellipse cx="56" cy="10.4" rx="3.4" ry="1.6" fill="#5a3a2c"/>
</svg>
