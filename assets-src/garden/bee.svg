<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 28">
  <defs>
    <radialGradient id="beeb" cx="0.6" cy="0.28" r="0.95">
      <stop offset="0" stop-color="#fbdf8a"/><stop offset="0.55" stop-color="#f4c15d"/><stop offset="1" stop-color="#b8862a"/>
    </radialGradient>
  </defs>
  <!-- far wing, smaller behind the near one -->
  <ellipse cx="25" cy="7.6" rx="4.8" ry="2.9" fill="#fff" opacity="0.5" transform="rotate(24 25 7.6)"/>
  <path d="M22 6 Q25 4.4 28.6 5.6" fill="none" stroke="#fff" stroke-width="0.8" opacity="0.5"/>
