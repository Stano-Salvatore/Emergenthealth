  <circle cx="7.8" cy="14.6" r="4.6" fill="#3a3128"/>
  <circle cx="6.4" cy="13.2" r="1.2" fill="#7a7268"/>
  <path d="M6 10.6 Q4 7.8 2.6 6.4" fill="none" stroke="#3a3128" stroke-width="1.3" stroke-linecap="round"/>
