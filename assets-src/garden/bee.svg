  <ellipse cx="15" cy="6.2" rx="6.6" ry="4" fill="#fff" opacity="0.75" transform="rotate(-20 15 6.2)"/>
  <ellipse cx="13.8" cy="5" rx="2.8" ry="1.5" fill="#fff" opacity="0.9" transform="rotate(-20 13.8 5)"/>
  <path d="M10 8.5 Q15 4.6 20.4 6.4" fill="none" stroke="#dce4f0" stroke-width="0.9" opacity="0.9"/>
  <!-- stinger at the rear -->
  <path d="M30.6 19.2 L34.6 21.2 L30.9 22.6 Z" fill="#3a3128"/>
  <!-- body tilted toward the front-left -->
  <ellipse cx="19" cy="17.5" rx="11.5" ry="7.6" transform="rotate(-8 19 17.5)" fill="url(#beeb)"/>
  <!-- stripes wrapping the volume -->
