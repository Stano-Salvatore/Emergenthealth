name: CI

# Until now nothing ran the checks. The only workflow built the Android APK,
# `next build` has typescript.ignoreBuildErrors on, and the test suite only ever
# ran when someone remembered to run it locally — so a type error or a broken
# test could reach production unnoticed. This runs them on every push and PR.

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "src/**"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - ".github/workflows/ci.yml"
  pull_request:
  workflow_dispatch:

# Read-only: nothing here publishes anything.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        # Same retry as the Android workflow: the registry occasionally drops
        # the connection mid-install, which says nothing about the code.
        run: |
          for attempt in 1 2 3; do
            if npm install --ignore-scripts; then exit 0; fi
            echo "::warning::npm install failed (attempt $attempt/3) — retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Generate Prisma client
        # Skipped by --ignore-scripts above, and the types it emits are what
        # most of the app is typed against.
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Lint
        # Blocking as of the cleanup that cleared the backlog this used to
        # carry. `npx eslint src` is clean; keeping it that way is cheaper than
        # letting it drift back to ninety violations nobody reads.
        run: npx eslint src --max-warnings 0
