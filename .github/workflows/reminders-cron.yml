name: Reminder delivery

# Habit reminders, to-do reminders and scheduled medication doses are all set
# to a wall-clock time, so the checker has to run often enough to notice one
# falling due. Vercel's Hobby plan only allows daily crons — which meant a
# reminder set for anything other than the single daily run time was never
# delivered at all.
#
# GitHub Actions minutes are free and unmetered on public repositories, so this
# runs every 10 minutes. The endpoint keeps a per-day record of what it has
# already sent, so extra runs never duplicate a notification.
#
# Setup: add a repository secret CRON_SECRET (Settings → Secrets and
# variables → Actions) matching the CRON_SECRET env var in Vercel.

on:
  schedule:
    - cron: "*/10 * * * *" # GitHub may delay a few minutes; the catch-up window absorbs it
  workflow_dispatch: {}

# A late run should not stack up behind an in-flight one.
concurrency:
  group: reminder-delivery
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    # A hung function used to hold the job for six hours and queue every later
    # tick behind it; now the job dies in twenty minutes and the next tick runs.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Deliver due reminders
        env:
          APP_URL: https://emergenthealth.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_REMINDERS_URL }}
        run: |
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::CRON_SECRET repository secret is not set — every run will 401 and no reminder will ever be delivered."
            echo "Add it under Settings → Secrets and variables → Actions, matching CRON_SECRET in Vercel."
            exit 1
          fi

          failed=0
          # Every endpoint is wall-clock driven and keeps its own per-day
          # sent record, so running them all on the same tick is safe. The
          # morning/noon/evening nudges serve web-push devices (browsers,
          # PWAs) — the phone app schedules its own copies locally and is
          # not subscribed to web push, so there is no double delivery.
          # re-engagement caps itself at one nudge per user per day, so the
          # 10-minute tick is safe for it too.
          # place-checkins isn't a reminder, but it wants the same cadence for
          # the same reason: Hobby crons run once a day, and a daily pass would
          # notice yesterday's coffee. It is idempotent per visit.
          # wind-down-nudge and emergy-weekly-review are window-gated inside the
          # route (local evening hours; Sunday only for the review) and keep the
          # same per-day sent record, so the 10-minute tick is safe for them too.
          # emergy-push fires during each user's own 15:00 hour (it used to be
          # 15:00 UTC for everyone) and marks the day sent, so it needs this
          # tick to notice every timezone.
          for endpoint in habit-reminders med-reminders morning-reminder noon-reminder evening-reminder wind-down-nudge experiment-nudge emergy-weekly-review emergy-push monthly-export re-engagement place-checkins; do
            code=$(curl -sS --max-time 120 -o /tmp/out.txt -w "%{http_code}" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${APP_URL}/api/cron/${endpoint}") || true
            # Status and size only. Response bodies carry user ids and provider
            # error text, and these logs are public.
            echo "== ${endpoint}: HTTP $code ($(wc -c < /tmp/out.txt | tr -d ' ') bytes)"

            case "$code" in
              200) ;;
              401|403)
                echo "::error::${endpoint} rejected the CRON_SECRET (HTTP $code) — it does not match Vercel's."
                failed=1 ;;
              503)
                # VAPID keys missing — push cannot work until they are configured
                echo "::warning::push notifications are not configured (HTTP 503)" ;;
              *)
                # Cold starts and network blips shouldn't turn the run red
                echo "::warning::${endpoint} returned $code" ;;
            esac
          done

          # A dead-man's switch. GitHub disables a scheduled workflow after 60
          # days without a push to the default branch, and a slipped or hung
          # schedule looks exactly like a quiet one. A free healthchecks.io
          # check with a grace period longer than the schedule pages when this
          # ping stops arriving — the one failure nothing else here reports.
          # Optional: unset means no ping.
          if [ -n "${HEALTHCHECKS_URL:-}" ]; then
            suffix=""; [ "$failed" = "1" ] && suffix="/fail"
            curl -fsS -m 10 --retry 3 "${HEALTHCHECKS_URL}${suffix}" >/dev/null || echo "::warning::healthchecks ping failed"
          fi
          exit $failed
