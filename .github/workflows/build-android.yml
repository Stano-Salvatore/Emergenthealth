name: Build Android APK (signed)

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "src/**"
      - "capacitor.config.ts"
      - "package.json"
      - ".ci/**"
      - "android-widget/**"
      - ".github/workflows/build-android.yml"
      - "public/.well-known/assetlinks.json"
      - "public/icons/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        # The registry occasionally drops the connection mid-install
        # (npm ECONNRESET), which has no bearing on the code being built —
        # retry before failing a release build over a network blip.
        run: |
          for attempt in 1 2 3; do
            if npm install --ignore-scripts; then exit 0; fi
            echo "::warning::npm install failed (attempt $attempt/3) — retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "::error::npm install failed after 3 attempts"
          exit 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform & build-tools
        run: sdkmanager "platforms;android-36" "build-tools;34.0.0"

      - name: Initialize Android project
        run: |
          npx cap add android
          mkdir -p android/app/src/main/assets

      # cap add regenerates the manifest each build, so this can't be committed.
      - name: Declare SCHEDULE_EXACT_ALARM
        run: node .ci/patch-android-manifest.mjs

      - name: Generate Android launcher icon
        run: node .ci/generate-android-icons.mjs

      - name: Decode release keystore
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > /tmp/emergenthealth-release.jks
            echo "ANDROID_KEYSTORE_PATH=/tmp/emergenthealth-release.jks" >> $GITHUB_ENV
            echo "✓ Keystore decoded"
          else
            echo "ℹ️  No ANDROID_KEYSTORE_BASE64 secret — release APK will be unsigned"
          fi
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Apply Android customizations
        run: python3 .ci/customize-android.py
        env:
          # Monotonic per-workflow counter; customize-android.py adds an offset
          # so Play never sees a versionCode already used by sideloaded builds.
          ANDROID_RUN_NUMBER: ${{ github.run_number }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Sync Capacitor
        run: |
          mkdir -p out
          NEXT_PUBLIC_APP_URL=https://emergenthealth.vercel.app npx cap sync android

      # cap sync writes the list of plugins the app will instantiate at runtime
      # into capacitor.plugins.json — a class merely present in the dex but
      # absent here is never registered, and every bridge call to it goes
      # unanswered. That failure builds and installs fine, so it must fail
      # here instead of on someone's phone.
      - name: Verify native plugin registration
        run: |
          PLUGINS=android/app/src/main/assets/capacitor.plugins.json
          echo "Registered Capacitor plugins:" && cat "$PLUGINS"
          for pkg in "@capacitor/local-notifications" "@capacitor/geolocation" "@capacitor/preferences"; do
            if ! grep -q "\"$pkg\"" "$PLUGINS"; then
              echo "::error::$pkg missing from $PLUGINS — the APK would build without it"
              exit 1
            fi
          done

      - name: Patch kiwi-health Kotlin JVM target
        run: python3 .ci/patch-kiwi-health.py

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK
        shell: bash
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          cd android && ./gradlew assembleRelease bundleRelease --no-daemon 2>&1 | tee /tmp/gradle.log
          grep -E "FAILED|error:|BUILD" /tmp/gradle.log | tail -20 || true

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: emergenthealth-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
          retention-days: 90

      # Play Store uploads require an Android App Bundle, not an APK.
      - name: Upload release AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: emergenthealth-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 90

      # Publish both artifacts to a rolling GitHub Release. Bookmark these —
      # each is a direct download, no login and no zip to unpack, which is what
      # makes them usable from a phone:
      #   .../releases/latest/download/emergenthealth.apk   sideload onto a device
      #   .../releases/latest/download/emergenthealth.aab   upload to Play Console
      # The APK is only for sideloading; Play will not accept it. Same keystore
      # ⇒ APK installs update in place (local data kept). main only.
      - name: Publish APK + AAB to GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab

          FILES=""
          [ -f "$APK" ] && cp "$APK" emergenthealth.apk && FILES="$FILES emergenthealth.apk"
          [ -f "$AAB" ] && cp "$AAB" emergenthealth.aab && FILES="$FILES emergenthealth.aab"
          if [ -z "$FILES" ]; then
            echo "::warning::Neither APK nor AAB found — skipping Release publish."
            exit 0
          fi

          # Play rejects a bundle whose versionCode it has already seen, so the
          # notes carry it: it's the number to expect in the Play upload.
          VERSION_CODE=$(grep -oP 'versionCode \K\d+' android/app/build.gradle | head -1)

          # Recreate the rolling tag so the Release always reflects the latest build.
          gh release delete latest-android --yes --cleanup-tag || true
          gh release create latest-android $FILES \
            --title "Latest Android build" \
            --notes "versionCode ${VERSION_CODE:-unknown} · commit ${GITHUB_SHA} · built $(date -u '+%Y-%m-%d %H:%M UTC')

          - **emergenthealth.aab** — upload this one to Play Console
          - **emergenthealth.apk** — sideload onto a device for testing" \
            --latest
