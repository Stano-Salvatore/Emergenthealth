name: Build Android APK (signed)

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "src/**"
      - "capacitor.config.ts"
      - "package.json"
      - ".ci/**"
      - "android-widget/**"
      - ".github/workflows/build-android.yml"
      - "public/.well-known/assetlinks.json"
      - "public/icons/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        # The registry occasionally drops the connection mid-install
        # (npm ECONNRESET), which has no bearing on the code being built —
        # retry before failing a release build over a network blip.
        run: |
          for attempt in 1 2 3; do
            if npm install --ignore-scripts; then exit 0; fi
            echo "::warning::npm install failed (attempt $attempt/3) — retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "::error::npm install failed after 3 attempts"
          exit 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform & build-tools
        run: sdkmanager "platforms;android-36" "build-tools;34.0.0"

      - name: Initialize Android project
        run: |
          npx cap add android
          mkdir -p android/app/src/main/assets

      # cap add regenerates the manifest each build, so this can't be committed.
      - name: Declare SCHEDULE_EXACT_ALARM
        run: node .ci/patch-android-manifest.mjs

      - name: Generate Android launcher icon
        run: node .ci/generate-android-icons.mjs

      - name: Decode release keystore
        run: |
          # A secret gets to CI by way of a terminal, a clipboard and a web form,
          # and any of those can add carriage returns or wrap the value. GNU
          # base64 tolerates plain line breaks and nothing else, so a value
          # pasted from Windows — or from `certutil -encode`, which adds a
          # BEGIN/END header too — fails with the whole of "base64: invalid
          # input" and a red build that says nothing about which secret or why.
          # Strip the packaging rather than making the person who pasted it
          # guess. What CANNOT be repaired is reported by name, and loudly.
          clean_b64() {
            printf '%s' "$1" | tr -d '\r\n \t' | sed -e 's/-----[A-Z ]*-----//g'
          }

          if [ -n "$GOOGLE_SERVICES_B64" ]; then
            mkdir -p android/app
            # Take the file either way. Pasting the JSON itself rather than a
            # base64 of it is the obvious thing to do with a secret named after
            # a .json file, and lib/fcm.ts already accepts both forms for the
            # service account — so refusing it here was this repo disagreeing
            # with itself about what a config secret looks like.
            if [ "$(printf '%s' "$GOOGLE_SERVICES_B64" | tr -d '[:space:]' | head -c1)" = "{" ]; then
              printf '%s' "$GOOGLE_SERVICES_B64" > android/app/google-services.json
              echo "· secret held the JSON itself, not base64 — used as-is"
            elif ! clean_b64 "$GOOGLE_SERVICES_B64" | base64 -d > android/app/google-services.json 2>/dev/null \
              && ! printf '%s' "$GOOGLE_SERVICES_B64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > android/app/google-services.json 2>/dev/null; then
              # Last resort above: keep only base64 alphabet characters. That
              # rescues a value carrying a byte-order mark or other invisible
              # packaging, and cannot quietly produce the wrong file — whatever
              # it yields still has to pass the JSON check below.
              #
              # Describe the value rather than printing it. Length and shape are
              # enough to tell a truncated paste from a wrong-encoding one, and
              # neither reveals the contents.
              n=$(printf '%s' "$GOOGLE_SERVICES_B64" | wc -c)
              bad=$(printf '%s' "$GOOGLE_SERVICES_B64" | tr -d 'A-Za-z0-9+/=[:space:]' | wc -c)
              first=$(printf '%s' "$GOOGLE_SERVICES_B64" | head -c1 | od -An -tx1 | tr -d ' ')
              echo "::error::GOOGLE_SERVICES_JSON_BASE64 is neither JSON nor base64 (length ${n}, ${bad} characters outside the base64 alphabet, first byte 0x${first}). Re-paste the contents of google-services.json exactly."
              exit 1
            fi
            # Decoding cleanly is not the same as being the right file: a
            # truncated paste can still decode into bytes that are not JSON,
            # and google-services would then fail much later and less clearly.
            if ! python3 -c "import json,sys; d=json.load(open('android/app/google-services.json')); sys.exit(0 if d.get('project_info') else 1)"; then
              echo "::error::GOOGLE_SERVICES_JSON_BASE64 decoded, but is not a google-services.json (no project_info). Re-download it from the Firebase console."
              exit 1
            fi
            echo "✓ google-services.json written — native push will be built in"
          else
            echo "ℹ️  No GOOGLE_SERVICES_JSON_BASE64 secret — APK built without native push"
          fi

          if [ -n "$KEYSTORE_B64" ]; then
            if ! clean_b64 "$KEYSTORE_B64" | base64 -d > /tmp/emergenthealth-release.jks 2>/dev/null \
              && ! printf '%s' "$KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > /tmp/emergenthealth-release.jks 2>/dev/null; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64. Regenerate it with:  base64 -w0 your-release.jks"
              exit 1
            fi
            # Decoding is not the same as being a keystore. These two secrets sit
            # next to each other in the GitHub UI with identical pencil icons,
            # and a paste meant for one landing on the other is a real and
            # already-observed mistake — one that would otherwise surface as an
            # inscrutable Gradle signing error several minutes later, or worse,
            # as an APK signed by something unexpected.
            #
            # JKS files start with the magic 0xFEEDFEED; PKCS#12 and BKS start
            # with a DER SEQUENCE, 0x30 0x82. Anything else is not a keystore.
            magic=$(head -c2 /tmp/emergenthealth-release.jks | od -An -tx1 | tr -d ' \n')
            if [ "$magic" != "feed" ] && [ "$magic" != "3082" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 decoded, but is not a keystore (starts 0x${magic}, expected 0xfeed for JKS or 0x3082 for PKCS#12). Check the value did not land on the wrong secret."
              exit 1
            fi
            echo "ANDROID_KEYSTORE_PATH=/tmp/emergenthealth-release.jks" >> $GITHUB_ENV
            echo "APK_VARIANT=release" >> $GITHUB_ENV
            echo "✓ Keystore decoded"
          elif [ "$GITHUB_REF_NAME" = "main" ]; then
            # A main build exists to ship a signed release: it publishes the
            # rolling `latest-android` Release below. Without the keystore it can
            # only make an unsigned debug APK, and the publish steps are gated on
            # the release variant — so they'd be skipped and the Release would
            # quietly freeze at its last signed build. That went unnoticed for
            # days once precisely because the run still went green. Fail here,
            # loudly, so a missing signing secret can never again silently stop
            # shipping without turning a main build red.
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set, so this main build cannot produce or publish a signed release (it would fall back to an unsigned debug APK and skip the Release). Add the signing secrets — ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD — under Settings → Secrets and variables → Actions, then re-run this workflow."
            exit 1
          else
            # Off main (branch and PR builds), an unsigned release APK cannot be
            # installed on Android at all, so a debug build is what's useful:
            # signed with the SDK's own debug key, it installs on a phone to try.
            #
            # It is not a substitute for the release build — a different
            # signature means it installs alongside, not over, an existing
            # install, and Play will not take it. The artifact name says so.
            echo "APK_VARIANT=debug" >> $GITHUB_ENV
            echo "ℹ️  No ANDROID_KEYSTORE_BASE64 secret — building a DEBUG APK instead"
            echo "   (installable for testing; not a release build, and not for Play)"
          fi
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

      - name: Apply Android customizations
        run: python3 .ci/customize-android.py
        env:
          # Monotonic per-workflow counter; customize-android.py adds an offset
          # so Play never sees a versionCode already used by sideloaded builds.
          ANDROID_RUN_NUMBER: ${{ github.run_number }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Sync Capacitor
        run: |
          mkdir -p out
          NEXT_PUBLIC_APP_URL=https://emergenthealth.vercel.app npx cap sync android

      # cap sync writes the list of plugins the app will instantiate at runtime
      # into capacitor.plugins.json — a class merely present in the dex but
      # absent here is never registered, and every bridge call to it goes
      # unanswered. That failure builds and installs fine, so it must fail
      # here instead of on someone's phone.
      - name: Verify native plugin registration
        run: |
          PLUGINS=android/app/src/main/assets/capacitor.plugins.json
          echo "Registered Capacitor plugins:" && cat "$PLUGINS"
          for pkg in "@capacitor/local-notifications" "@capacitor/geolocation" "@capacitor/preferences" "@capacitor-community/speech-recognition" "@capacitor-community/background-geolocation"; do
            if ! grep -q "\"$pkg\"" "$PLUGINS"; then
              echo "::error::$pkg missing from $PLUGINS — the APK would build without it"
              exit 1
            fi
          done

      - name: Patch kiwi-health Kotlin JVM target
        run: python3 .ci/patch-kiwi-health.py

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK
        shell: bash
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ "$APK_VARIANT" = "debug" ]; then
            # No bundle: an AAB is only useful to Play, which will not take a
            # debug build anyway.
            cd android && ./gradlew assembleDebug --no-daemon 2>&1 | tee /tmp/gradle.log
          else
            cd android && ./gradlew assembleRelease bundleRelease --no-daemon 2>&1 | tee /tmp/gradle.log
          fi
          grep -E "FAILED|error:|BUILD" /tmp/gradle.log | tail -20 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: emergenthealth-${{ env.APK_VARIANT }}
          path: android/app/build/outputs/apk/${{ env.APK_VARIANT }}/app-${{ env.APK_VARIANT }}.apk
          if-no-files-found: warn
          retention-days: 90

      # Play Store uploads require an Android App Bundle, not an APK.
      - name: Upload release AAB (Play Store)
        if: env.APK_VARIANT == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: emergenthealth-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 90

      # Publish both artifacts to a rolling GitHub Release. Bookmark these —
      # each is a direct download, no login and no zip to unpack, which is what
      # makes them usable from a phone:
      #   .../releases/latest/download/emergenthealth.apk   sideload onto a device
      #   .../releases/latest/download/emergenthealth.aab   upload to Play Console
      # The APK is only for sideloading; Play will not accept it. Same keystore
      # ⇒ APK installs update in place (local data kept). main only.
      - name: Publish APK + AAB to GitHub Release
        if: github.ref == 'refs/heads/main' && env.APK_VARIANT == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab

          FILES=""
          [ -f "$APK" ] && cp "$APK" emergenthealth.apk && FILES="$FILES emergenthealth.apk"
          [ -f "$AAB" ] && cp "$AAB" emergenthealth.aab && FILES="$FILES emergenthealth.aab"
          if [ -z "$FILES" ]; then
            echo "::warning::Neither APK nor AAB found — skipping Release publish."
            exit 0
          fi

          # Play rejects a bundle whose versionCode it has already seen, so the
          # notes carry it: it's the number to expect in the Play upload.
          VERSION_CODE=$(grep -oP 'versionCode \K\d+' android/app/build.gradle | head -1)

          # Recreate the rolling tag so the Release always reflects the latest build.
          gh release delete latest-android --yes --cleanup-tag || true
          gh release create latest-android $FILES \
            --title "Latest Android build" \
            --notes "versionCode ${VERSION_CODE:-unknown} · commit ${GITHUB_SHA} · built $(date -u '+%Y-%m-%d %H:%M UTC')

          - **emergenthealth.aab** — upload this one to Play Console
          - **emergenthealth.apk** — sideload onto a device for testing" \
            --latest
