name: Scheduled data sync

# Drives the server-side sync endpoints on a schedule, for free, 24/7 —
# independent of Vercel's Hobby once-per-day cron limit, an always-on
# server, or the app being open. GitHub runs this on the default branch.
#
# Setup: add a repository secret CRON_SECRET (Settings → Secrets and
# variables → Actions) matching the CRON_SECRET env var in Vercel.

on:
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes (GitHub may delay a few min)
  workflow_dispatch: {}      # allow manual runs from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync server-side data sources
        env:
          APP_URL: https://emergenthealth.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # A missing secret used to fail silently: every call 401'd while the
          # job still reported success, so months of "green" runs synced
          # nothing. Misconfiguration now fails loudly; only transient errors
          # are downgraded to warnings.
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::CRON_SECRET repository secret is not set — every sync will 401."
            echo "Add it under Settings → Secrets and variables → Actions, matching CRON_SECRET in Vercel."
            exit 1
          fi

          # Data syncs only — health + finances. The notification crons stay on
          # Vercel's daily schedule; running those this often would spam.
          #
          # Strava is here as well as in vercel.json. That schedule is daily, so
          # on its own a ride recorded this morning would not show up until
          # tomorrow — which is what made it look neglected on the sync screen.
          auth_failed=0
          for path in oura strava ynab truelayer; do
            code=$(curl -sS -o /tmp/out.txt -w "%{http_code}" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${APP_URL}/api/cron/${path}") || true
            echo "[${path}] HTTP $code"; cat /tmp/out.txt || true; echo
            if [ "$code" = "401" ] || [ "$code" = "403" ]; then
              echo "::error::${path} rejected the CRON_SECRET (HTTP $code) — it does not match Vercel's."
              auth_failed=1
            elif [ "$code" != "200" ]; then
              # Network blips and cold starts shouldn't turn the run red
              echo "::warning::${path} sync returned $code"
            fi
          done
          exit $auth_failed
